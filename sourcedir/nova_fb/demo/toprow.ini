; Orientation test: write ONE row (16 words) only, using AUTOINC.
; Proves row 0 = top of image and bit 15 = leftmost pixel.
set fb width=256
set fb height=256
set fb prefix=output/toprow
; 50=start addr  51=all bits set  52=control(AUTOINC)  53=count 16 words
d 50 0
d 51 177777
d 52 20000
d 53 20
d 100 20052
d 101 63042
d 102 20050
d 103 61042
d 104 24051
d 105 66042
d 106 014053
d 107 000105
d 110 60342
d 111 63077
go 100
quit
