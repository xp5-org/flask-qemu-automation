; Exercises all three pixel ops on row 0 of a 256x256 frame:
;   SET   x=0..63   (op 0, DOB bits 14-13 = 0)
;   CLEAR x=0..31   (op 1, DOB = 020000)
;   XOR   x=0..15   (op 2, DOB = 040000)
; Expected row 0: px 0-15 lit (XOR toggled them back on), 16-31 clear,
; 32-63 lit, 64+ clear. Everything below row 0 stays black.
set fb width=256
set fb height=256
set fb prefix=output/pixel_ops
; 50=X start  51=Y+op SET   52=control(PIXEL)  53=count 64
; 54=Y+op CLEAR  55=count 32  56=Y+op XOR  57=count 16
d 50 0
d 51 0
d 52 10000
d 53 100
d 54 20000
d 55 40
d 56 40000
d 57 20
d 100 20052
d 101 63042
d 102 20050
d 103 24051
d 104 61042
d 105 66042
d 106 101400
d 107 014053
d 110 000104
d 111 20050
d 112 24054
d 113 61042
d 114 66042
d 115 101400
d 116 014055
d 117 000113
d 120 20050
d 121 24056
d 122 61042
d 123 66042
d 124 101400
d 125 014057
d 126 000122
d 127 60342
d 130 63077
go 100
quit
