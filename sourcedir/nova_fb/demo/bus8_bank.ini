; 8-bit bus mode + A16 bank bit, with AUTOINC so the bytes stream.
; control = 0160000: bit15 BUS8 | bit14 BANK | bit13 AUTOINC.
; Writes 128 bytes at latch 0 with bank=1, which lands at word 32768 ->
; row 512 of a 1024-wide frame. Demonstrates the paging an 8-bit bus forces.
set fb width=1024
set fb height=1024
set fb prefix=output/bank
d 50 0
d 51 160000
d 52 377
d 53 200
d 100 20051
d 101 63042
d 102 20050
d 103 61042
d 104 24052
d 105 66042
d 106 014053
d 107 000105
d 110 60342
d 111 63077
go 100
quit
