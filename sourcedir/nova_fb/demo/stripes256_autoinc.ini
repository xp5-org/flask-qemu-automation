; SAME IMAGE, AUTOINC on (control bit 13 = 0020000): latch the address once,
; then stream DOB. Inner loop is THREE instructions per word:
;   DOB 1,42 / DSZ 53 / JMP
; Auto-increment does not prevent random access -- a random write just issues
; DOA first -- so it is a pure win over the explicit-address model.
set fb width=256
set fb height=256
set fb prefix=output/stripes_autoinc
; 50=start address  51=pattern  52=control(AUTOINC)  53=count
d 50 0
d 51 125252
d 52 20000
d 53 10000
d 100 20052
d 101 63042
d 102 20050
d 103 61042
d 104 24051
d 105 66042
d 106 014053
d 107 000105
d 110 60342
d 111 63077
go 100
e fb writes
e fb frame
quit
