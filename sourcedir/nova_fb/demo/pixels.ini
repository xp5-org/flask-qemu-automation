; PIXEL MODE (control bit 12 = 0010000): the card does the read-modify-write.
; Draws a 256px diagonal by setting individual pixels (i,i).
; Per pixel: DOA 0,42 (X) / DOB 0,42 (Y + op) -- two IOT, no shadow buffer,
; no read-back. X and Y are both AC0 here, which is why the line is diagonal.
set fb width=256
set fb height=256
set fb prefix=output/pixels
; 50=start coord  52=control(PIXEL)  53=count (256 pixels)
d 50 0
d 52 10000
d 53 400
d 100 20052
d 101 63042
d 102 20050
d 103 61042
d 104 62042
d 105 101400
d 106 014053
d 107 000103
d 110 60342
d 111 63077
go 100
e fb writes
e fb clipped
quit
