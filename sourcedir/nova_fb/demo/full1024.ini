; Full 1Mbit: 1024x1024, 65536 words, AUTOINC on.
; The address latch must wrap exactly back to 0 -- that is the proof that a
; 16-bit address covers the whole memory with no paging.
; DSZ starting from 0 wraps, giving exactly 65536 iterations.
set fb width=1024
set fb height=1024
set fb prefix=output/full
; 50=start addr  51=pattern  52=control(AUTOINC)  53=count (0 -> 65536)
d 50 0
d 51 125252
d 52 20000
d 53 0
d 100 20052
d 101 63042
d 102 20050
d 103 61042
d 104 24051
d 105 66042
d 106 014053
d 107 000105
d 110 60342
d 111 63077
go 100
e fb addr
e fb frame
quit
