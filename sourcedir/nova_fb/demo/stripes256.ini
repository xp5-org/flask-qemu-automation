; REAL CARD MODEL: an address with every write (AUTOINC off, the reset default).
; 256x256, fill every word with 0125252 (0xAAAA) -> 1px vertical stripes.
; Inner loop is FIVE instructions per word:
;   DOA 0,42 / DOB 1,42 / INC 0,0 / DSZ 53 / JMP
; Compare stripes256_autoinc.ini, which is three.
; SimH does NOT accept trailing comments -- keep them on their own lines.
set fb width=256
set fb height=256
set fb prefix=output/stripes
; 50=start address  51=pattern word  53=count (4096 words)
d 50 0
d 51 125252
d 53 10000
d 100 20050
d 101 24051
d 102 61042
d 103 66042
d 104 101400
d 105 014053
d 106 000102
d 107 60342
d 110 63077
go 100
e fb writes
e fb frame
quit
